name: Sync Substack writing

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/sync-substack.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit new posts
        run: |
          git add src/data/substack-posts.json
          if git diff --cached --quiet; then
            echo "No new posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Substack articles"
          git push
