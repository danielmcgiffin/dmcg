name: Sync Substack writing

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the current site even when there are no new posts
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/sync-substack.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check Cloudflare deployment credentials
        id: cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit new posts
        id: commit
        run: |
          git add src/data/substack-posts.json
          if git diff --cached --quiet; then
            echo "No new posts"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Substack articles"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy new posts
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy == true) && steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 038f386f26a1a9bef9eb2d50e7f8c218
      - name: Report missing Cloudflare credentials
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy == true) && steps.cloudflare.outputs.ready != 'true'
        run: echo "::warning::Live deployment skipped because CLOUDFLARE_API_TOKEN is not configured."
