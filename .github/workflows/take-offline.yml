name: Temporarily take site offline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmcg-production
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record existing deployment for rollback
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 038f386f26a1a9bef9eb2d50e7f8c218
          wranglerVersion: '4.155.0'
          command: deployments list --name dmcg
      - name: Replace public site with temporary unavailability response
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 038f386f26a1a9bef9eb2d50e7f8c218
          wranglerVersion: '4.155.0'
          command: deploy --config wrangler.offline.jsonc
